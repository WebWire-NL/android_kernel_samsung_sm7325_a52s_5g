name: Manual debug session

# An interactive shell on the same GitHub-hosted image the kernel build uses, so
# a question about the runner costs a minute instead of a 27-minute build cycle.
# Dispatch it with, for example:
#
#   gh workflow run debug.yml --ref ci/optimize-docker-build -f runner=ubuntu-22.04
#
# The job waits for you: open the run page in a browser, expand the last step and
# copy the "SSH: ssh ..." line, then connect with
# `ssh -i ~/.ssh/id_ed25519 <that address>`. The API cannot help here - GitHub
# shows a live log only to a signed-in viewer, and the archived log blob does not
# exist until the job ends. The job resumes when you disconnect, or when
# timeout-minutes above fires; cancelling the run also ends the session.
#
# What you land in, when build_env is true:
#   * the same repo checkout and the same defconfig edits build.yml makes (LXC
#     profile + CONFIG_SYSVIPC), on the branch name build_kernel_zip.sh expects;
#   * the build dependencies installed (kmod for depmod, bc, bison, flex, lz4...);
#   * toolchain/clang, toolchain/magiskboot and toolchain/avbtool restored from
#     the cache build.yml populates, so `bash build_kernel_zip.sh` skips its
#     987 MB / ~4.5 min clang download and goes straight to compiling.
#
# Doing a build in here:
#   * `bash build_kernel_zip.sh` — ~25 min, and it is the *same* build CI runs.
#   * build_kernel_zip.sh:389 is `rm -rf "${OUT_DIR}"`, so running it a second
#     time rebuilds from scratch. If you only need to iterate on the packaging
#     tail (boot.img / dtbo / vendor_boot / zip), delete that line (or run a copy
#     of the script without it) and the next run's `make` is incremental.
#   * the restored toolchain is read-only here on purpose: actions/cache/restore
#     never writes, so a session cannot leave a half-downloaded toolchain in the
#     cache the real build depends on.
#
# ── This repository is PUBLIC ────────────────────────────────────────────────
#   * Everything the job prints, tmate connection string included, is
#     world-readable - and action-tmate's README is explicit that with SSH keys
#     on the GitHub profile "only those keys are authorized to connect,
#     otherwise anybody can connect to the tmate session". WebWire-NL now has
#     ~/.ssh/id_ed25519.pub registered against it; `limit-access-to-actor: true`
#     is what enforces that, and it also means the step fails outright rather
#     than opening a session if the account ever has no key registered.
#   * permissions is contents: read deliberately: the session is for building
#     and looking, not for pushing. Do not raise it.
#   * tmate relays the session through tmate.io's servers, so that service can
#     see what you type.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (the same images the build offers)"
        required: true
        type: choice
        default: "ubuntu-22.04"
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
      prepare:
        description: "Free disk + add 8G swap first, exactly as the build does"
        required: true
        type: boolean
        default: true
      build_env:
        description: "Also make this a build-ready environment (deps, defconfig, toolchain cache)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  shell:
    name: Interactive shell
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        if: ${{ inputs.prepare }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap (the vmlinux link is memory hungry)
        if: ${{ inputs.prepare }}
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Record the runner we actually got
        run: |
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          nproc
          free -h
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Same reason as in build.yml: build_kernel_zip.sh picks the ROM type and
      # the root solution out of the *local* branch name, and a ci/ name trips
      # its `set -u` ("ROM_DISPLAY: unbound variable") after a full build.
      - name: Name the branch for build_kernel_zip.sh
        run: |
          LOCAL_BRANCH="resukisu-aosp-${GITHUB_REF_NAME//\//-}"
          echo "branch name handed to build_kernel_zip.sh: $LOCAL_BRANCH"
          git checkout -B "$LOCAL_BRANCH"

      - name: Restore the toolchain, read-only
        if: ${{ inputs.build_env }}
        uses: actions/cache/restore@v6
        with:
          path: |
            toolchain/clang
            toolchain/magiskboot
            toolchain/avbtool
          key: ${{ runner.os }}-${{ runner.arch }}-a52sxq-clang-r530567-v1

      - name: Install build dependencies
        if: ${{ inputs.build_env }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            zip unzip cpio rsync kmod python3 device-tree-compiler lz4 zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Enable Docker / LXC kernel options in the defconfig
        if: ${{ inputs.build_env }}
        run: |
          curl -sL -o cfg.py https://raw.githubusercontent.com/dabao1955/kernel_build_action/main/config.py
          python3 cfg.py -t lxc -w arch/arm64/configs/vendor/a52sxq_kor_single_defconfig

      - name: Add the option the LXC profile does not cover
        if: ${{ inputs.build_env }}
        run: |
          # cfg.py's LXC profile leaves SYSVIPC off. IPC_NS still validates
          # (init/Kconfig:1129 "depends on (SYSVIPC || POSIX_MQUEUE)"), but
          # System V IPC (shmget/semget/msgget) is then unavailable in containers.
          DEFCONFIG=arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          printf '\n# ---- appended by CI ----\nCONFIG_SYSVIPC=y\n' >> "$DEFCONFIG"
          tail -4 "$DEFCONFIG"

      - name: Start the tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          # Deliberately *not* detached, and no later step republishes the
          # connection string: with detached mode the daemon holds this step's
          # stdout pipe, so the step never completes and no later step is ever
          # reached (runs 35380689573 and 35381000135 both sat here for minutes
          # with the following steps still pending, and connect-timeout-seconds
          # does not change that).
